name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove credentials, tokens and private stream or add-on URLs from anything you paste.
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options: [Android phone/tablet, Android TV, iPhone/iPad, Apple TV, Mac, Windows]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Meowio version
      placeholder: "0.2.1"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: "Pixel 8, Android 15"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
