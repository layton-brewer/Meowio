name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: dropdown
    id: apps
    attributes:
      label: Which apps?
      multiple: true
      options: [Android phone/tablet, Android TV, iPhone/iPad, Apple TV, Mac, Windows, All of them]
