name: Apple builds

on:
  push:
    branches: [main, claude/apple-builds]
    paths:
      - "mobile/**"
      - ".github/workflows/apple.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apple
  cancel-in-progress: true

jobs:
  ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    env:
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mobile/gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Fetch MPVKit
        run: |
          git clone --depth 1 --branch Nuvio https://github.com/NuvioMedia/MPVKit.git MPVKit

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build unsigned IPA
        run: ./scripts/build-ios-ipa.sh

      - name: Rename IPA
        run: |
          ipa="$(ls build/ios-ipa/*.ipa | head -n 1)"
          mv "$ipa" build/ios-ipa/Meowio-ios.ipa
          shasum -a 256 build/ios-ipa/Meowio-ios.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Meowio-ios
          path: mobile/build/ios-ipa/Meowio-ios.ipa
          retention-days: 14

  macos:
    name: Build macOS DMG (unsigned, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch desktop sources
        run: |
          brew install git-lfs || true
          git lfs install
          git clone --depth 1 https://github.com/NuvioMedia/NuvioDesktop.git desktop
          cd desktop
          git lfs pull --include="composeApp/src/desktopMain/native/macos/runtime/${{ matrix.arch }}/**" --exclude=""

      - name: Apply Meowio branding and overlay
        run: ./apple/macos/apply-overlay.sh desktop

      - name: Build DMG
        working-directory: desktop
        run: |
          printf 'NUVIO_SUPABASE_URL=\nNUVIO_SUPABASE_ANON_KEY=\nTRAKT_CLIENT_ID=\nTRAKT_CLIENT_SECRET=\nMDBLIST_CLIENT_ID=\n' > local.properties
          ./gradlew :composeApp:packageReleaseDmg -Pcompose.desktop.packaging.checkJdkVendor=false -Pnuvio.macos.arch=${{ matrix.arch }} --no-daemon --no-configuration-cache --max-workers=2
          find composeApp/build -name "*.dmg"

      - name: Collect DMG
        run: |
          mkdir -p out
          dmg="$(find desktop/composeApp/build -name '*.dmg' | head -n 1)"
          cp "$dmg" "out/Meowio-macos-${{ matrix.arch }}.dmg"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Meowio-macos-${{ matrix.arch }}
          path: out/*.dmg
          retention-days: 14

  tvos:
    name: Build tvOS IPA (unsigned)
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tvos
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos || true
          brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Meowio.xcodeproj -scheme Meowio -configuration Release \
            -sdk appletvos -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build

      - name: Package IPA
        run: |
          app="build/Build/Products/Release-appletvos/Meowio.app"
          test -d "$app"
          rm -rf pkg && mkdir -p pkg/Payload
          cp -R "$app" pkg/Payload/
          (cd pkg && zip -qry ../Meowio-tvos.ipa Payload)
          shasum -a 256 Meowio-tvos.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Meowio-tvos
          path: tvos/Meowio-tvos.ipa
          retention-days: 14

  publish:
    name: Publish Apple release
    needs: [ios, macos, tvos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          tag=apple-latest
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Meowio for Apple (iOS, macOS, tvOS)" --notes "Unsigned builds for sideloading. See the README for install steps." --prerelease
          gh release upload "$tag" dist/* --clobber
