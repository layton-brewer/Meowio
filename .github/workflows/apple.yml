name: Apple builds

on:
  push:
    branches: [main]
    paths:
      - "mobile/iosApp/**"
      - "mobile/composeApp/src/iosMain/**"
      - "mobile/composeApp/src/iosFull/**"
      - "apple/**"
      - "mobile/composeApp/src/commonMain/**"
      - "mobile/composeApp/src/fullCommonMain/**"
      - ".github/workflows/apple.yml"
  # Pull requests build everything as a compile check; only main attaches files to the release.
  pull_request:
    paths:
      - "mobile/iosApp/**"
      - "mobile/composeApp/src/iosMain/**"
      - "mobile/composeApp/src/iosFull/**"
      - "apple/**"
      - "mobile/composeApp/src/commonMain/**"
      - "mobile/composeApp/src/fullCommonMain/**"
      - ".github/workflows/apple.yml"
  workflow_dispatch:

env:
  # Builds attach to this release page. Bump together with the version numbers below and the tag in release.yml.
  # Apple TV builds in appletv.yml and attaches to the same page, so tvOS changes never rebuild these.
  MEOWIO_TAG: v0.2.71

permissions:
  contents: write

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Check a Meowio release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Apple builds attach to the "Meowio $MEOWIO_TAG" release so every download lives on one
          # page. The upload steps wait for that page if the Android build hasn't created it yet.
          gh release view "$MEOWIO_TAG" --json tagName -q .tagName || echo "$MEOWIO_TAG not published yet; uploads will wait for it"

  ios:
    needs: [release]
    name: Build iOS IPA (unsigned)
    runs-on: macos-26
    timeout-minutes: 150
    defaults:
      run:
        working-directory: mobile
    env:
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: Debug
      NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mobile/gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Prepare local properties
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
        run: |
          touch local.properties
          if [ -n "$NUVIO_SUPABASE_URL" ]; then
            {
              echo "NUVIO_SUPABASE_URL=$NUVIO_SUPABASE_URL"
              echo "NUVIO_SUPABASE_ANON_KEY=$NUVIO_SUPABASE_ANON_KEY"
            } >> local.properties
          fi
          bash "$GITHUB_WORKSPACE/.github/scripts/add_tracking_keys.sh" local.properties

      - name: Stamp Meowio version
        # The IPA carries the Meowio version so the in-app update check compares against Meowio releases.
        run: |
          sed -i '' -E "s/^MARKETING_VERSION=.*/MARKETING_VERSION=${MEOWIO_TAG#v}/" iosApp/Configuration/Version.xcconfig
          cat iosApp/Configuration/Version.xcconfig

      - name: Fetch MPVKit
        run: |
          git clone --depth 1 --branch Nuvio https://github.com/NuvioMedia/MPVKit.git MPVKit

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: native/livetv-vpn/go.sum
      - name: Build Live TV VPN library
        run: bash "$GITHUB_WORKSPACE/native/livetv-vpn/build-ios.sh" "$GITHUB_WORKSPACE/mobile/build/livetv-vpn"

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build unsigned IPA
        run: ./scripts/build-ios-ipa.sh

      - name: Rename IPA
        run: |
          ipa="$(ls build/ios-ipa/*.ipa | head -n 1)"
          mv "$ipa" build/ios-ipa/Meowio-ios.ipa
          shasum -a 256 build/ios-ipa/Meowio-ios.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Meowio-ios
          path: mobile/build/ios-ipa/Meowio-ios.ipa
          retention-days: 14

      - name: Attach to this version's Meowio release
        # Only main publishes. Other branches keep their build as a workflow artifact.
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Wait for this version's release page (the Android build creates it), then attach.
          for i in $(seq 1 80); do gh release view "$MEOWIO_TAG" >/dev/null 2>&1 && break; sleep 60; done
          # The Android release step carries older builds over right after it creates the page; let it finish,
          # then upload and confirm the file is really on the page (a concurrent carry-over can drop it).
          sleep 240
          for i in 1 2 3 4 5 6; do
            gh release upload "$MEOWIO_TAG" mobile/build/ios-ipa/Meowio-ios.ipa --clobber || true
            sleep 20
            gh release view "$MEOWIO_TAG" --json assets -q '.assets[] | select(.state == "uploaded") | .name' | grep -qxF "$(basename mobile/build/ios-ipa/Meowio-ios.ipa)" && exit 0
            sleep 40
          done
          exit 1

  macos:
    needs: [release]
    name: Build macOS DMG (unsigned, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only: Intel Macs were dropped in 0.2.42 (the Intel build was the slowest part of every release).
          - runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch desktop sources
        run: |
          brew install git-lfs || true
          git lfs install
          # Pinned to a Nuvio Desktop release tag so the Meowio overlay lands on the sources it was merged against.
          git init desktop
          cd desktop
          git remote add origin https://github.com/NuvioMedia/NuvioDesktop.git
          git fetch --depth 1 origin refs/tags/0.1.38-alpha
          git checkout --force FETCH_HEAD
          git lfs pull --include="composeApp/src/desktopMain/native/macos/runtime/${{ matrix.arch }}/**" --exclude=""

      - name: Apply Meowio branding and overlay
        run: ./apple/macos/apply-overlay.sh desktop

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: native/livetv-vpn/go.sum
      - name: Build Live TV VPN helper
        run: bash native/livetv-vpn/build-desktop.sh macos ${{ matrix.arch }} desktop

      - name: Build DMG
        working-directory: desktop
        env:
          # Same optional account server as the phone and iPhone builds; empty when the secrets are not set.
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
        run: |
          printf 'NUVIO_SUPABASE_URL=%s\nNUVIO_SUPABASE_ANON_KEY=%s\n' "$NUVIO_SUPABASE_URL" "$NUVIO_SUPABASE_ANON_KEY" > local.properties
          bash "$GITHUB_WORKSPACE/.github/scripts/add_tracking_keys.sh" local.properties
          ./gradlew :composeApp:packageReleaseDmg -Pcompose.desktop.packaging.checkJdkVendor=false -Pnuvio.macos.arch=${{ matrix.arch }} -Pnuvio.desktop.versionName=0.2.71 --no-daemon --no-configuration-cache --max-workers=2
          find composeApp/build -name "*.dmg"

      - name: Collect DMG
        run: |
          mkdir -p out
          dmg="$(find desktop/composeApp/build -name '*.dmg' | head -n 1)"
          cp "$dmg" "out/Meowio-macos-${{ matrix.arch }}.dmg"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Meowio-macos-${{ matrix.arch }}
          path: out/*.dmg
          retention-days: 14

      - name: Attach to this version's Meowio release
        # Only main publishes. Other branches keep their build as a workflow artifact.
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Wait for this version's release page (the Android build creates it), then attach.
          for i in $(seq 1 80); do gh release view "$MEOWIO_TAG" >/dev/null 2>&1 && break; sleep 60; done
          for i in 1 2 3 4; do gh release upload "$MEOWIO_TAG" "out/Meowio-macos-${{ matrix.arch }}.dmg" --clobber && exit 0; sleep 30; done
          exit 1

  altstore:
    needs: [ios]
    name: AltStore and SideStore source
    # Only main publishes. The source is one small file attached to the version's release page.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Meowio-ios
          path: ipa
      - name: Write the source and attach it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 80); do gh release view "$MEOWIO_TAG" >/dev/null 2>&1 && break; sleep 60; done
          # The release text before the download table is what changed in this version.
          gh release view "$MEOWIO_TAG" --json body -q .body | sed '/^## Download/,$d' > notes.txt || true
          python3 .github/scripts/altstore_source.py "$MEOWIO_TAG" ipa/Meowio-ios.ipa notes.txt altstore.json
          # The Android release step carries older builds over right after it creates the page; let it finish,
          # then upload and confirm the file is really on the page (a concurrent carry-over can drop it).
          sleep 240
          for i in 1 2 3 4 5 6; do
            gh release upload "$MEOWIO_TAG" altstore.json --clobber || true
            sleep 20
            gh release view "$MEOWIO_TAG" --json assets -q '.assets[] | select(.state == "uploaded") | .name' | grep -qxF "$(basename altstore.json)" && exit 0
            sleep 40
          done
          exit 1
