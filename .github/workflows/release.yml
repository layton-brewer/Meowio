name: Build and release

on:
  push:
    branches: [main]
    paths:
      - "tv/**"
      - "mobile/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  tv:
    name: Build TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: tv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Private settings (account server address and keys) come from repository
      # secrets only. They are never stored in the repository.
      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.TV_LOCAL_PROPERTIES_BASE64 }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*sdk\.dir[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi
          touch local.dev.properties
          if [ -n "$NUVIO_SUPABASE_URL" ]; then
            {
              echo "NUVIO_SUPABASE_URL=$NUVIO_SUPABASE_URL"
              echo "NUVIO_SUPABASE_ANON_KEY=$NUVIO_SUPABASE_ANON_KEY"
            } >> local.properties
          fi

      # The persistent signing key comes from secrets so every release installs
      # over the previous one. Without the secret, a throwaway key is generated
      # (the build still works, but updates won't install over an older one).
      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.jks"
            alias_name="$SIGNING_KEY_ALIAS"
            password="$SIGNING_PASSWORD"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set; using a throwaway key. Updates will not install over a previous version until this secret is added."
            alias_name=androiddebugkey
            password=android
            keytool -genkeypair -keystore "$RUNNER_TEMP/signing.jks" \
              -storepass "$password" -alias "$alias_name" -keypass "$password" \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "::add-mask::$password"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/signing.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=$alias_name"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$password"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$password"
            echo "SIGNING_KEY_ALIAS_RESOLVED=$alias_name"
            echo "SIGNING_PASSWORD_RESOLVED=$password"
          } >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew :app:assembleFullDebug -Pnuvio.app.versionName=0.1.${{ github.run_number }} -Pnuvio.app.versionCode=$((2000 + ${{ github.run_number }})) --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/full/debug/app-full-universal-debug.apk "$RUNNER_TEMP/Meowio-tv.apk"

      # Re-sign with the persistent key so the shipped APK always carries the
      # same signature regardless of how the build type signs by default.
      - name: Sign APK
        run: |
          echo "::add-mask::$SIGNING_PASSWORD_RESOLVED"
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner=$(find "$sdk/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/signing.jks" \
            --ks-pass "pass:$SIGNING_PASSWORD_RESOLVED" \
            --ks-key-alias "$SIGNING_KEY_ALIAS_RESOLVED" \
            --key-pass "pass:$SIGNING_PASSWORD_RESOLVED" \
            "$RUNNER_TEMP/Meowio-tv.apk"
          "$apksigner" verify --print-certs "$RUNNER_TEMP/Meowio-tv.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tv-apk
          path: ${{ runner.temp }}/Meowio-tv.apk
          if-no-files-found: error
          retention-days: 7

  mobile:
    name: Build phone APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.MOBILE_LOCAL_PROPERTIES_BASE64 }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi
          if [ -n "$NUVIO_SUPABASE_URL" ]; then
            {
              echo "NUVIO_SUPABASE_URL=$NUVIO_SUPABASE_URL"
              echo "NUVIO_SUPABASE_ANON_KEY=$NUVIO_SUPABASE_ANON_KEY"
            } >> local.properties
          fi

      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.jks"
            alias_name="$SIGNING_KEY_ALIAS"
            password="$SIGNING_PASSWORD"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set; using a throwaway key. Updates will not install over a previous version until this secret is added."
            alias_name=androiddebugkey
            password=android
            keytool -genkeypair -keystore "$RUNNER_TEMP/signing.jks" \
              -storepass "$password" -alias "$alias_name" -keypass "$password" \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "::add-mask::$password"
          {
            echo "SIGNING_KEY_ALIAS_RESOLVED=$alias_name"
            echo "SIGNING_PASSWORD_RESOLVED=$password"
          } >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore -Pnuvio.app.versionName=0.1.${{ github.run_number }} -Pnuvio.app.versionCode=$((3000 + ${{ github.run_number }})) --stacktrace

      - name: Rename APK
        run: cp androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk "$RUNNER_TEMP/Meowio-mobile.apk"

      - name: Sign APK
        run: |
          echo "::add-mask::$SIGNING_PASSWORD_RESOLVED"
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner=$(find "$sdk/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/signing.jks" \
            --ks-pass "pass:$SIGNING_PASSWORD_RESOLVED" \
            --ks-key-alias "$SIGNING_KEY_ALIAS_RESOLVED" \
            --key-pass "pass:$SIGNING_PASSWORD_RESOLVED" \
            "$RUNNER_TEMP/Meowio-mobile.apk"
          "$apksigner" verify --print-certs "$RUNNER_TEMP/Meowio-mobile.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: ${{ runner.temp }}/Meowio-mobile.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [tv, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.${{ github.run_number }}"
          gh release create "$tag" apks/*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Meowio $tag" \
            --notes "Phone: Meowio-mobile.apk. Android TV: Meowio-tv.apk. Built from commit ${{ github.sha }}." \
            --latest
