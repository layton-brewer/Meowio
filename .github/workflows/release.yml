name: Build and release

on:
  push:
    branches: [main]
    paths:
      - "tv/**"
      - "mobile/**"
      - "native/**"
      - ".github/workflows/release.yml"
  # Pull requests build both APKs as a compile check; only main publishes (also from the Actions tab).
  pull_request:
    paths:
      - "tv/**"
      - "mobile/**"
      - "native/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tv:
    name: Build TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: tv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Private settings (account server address and keys) come from repository
      # secrets only. They are never stored in the repository.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: native/livetv-vpn/go.sum
      - name: Build Live TV VPN library
        run: bash "$GITHUB_WORKSPACE/native/livetv-vpn/build-android.sh" "$ANDROID_NDK_LATEST_HOME" "$GITHUB_WORKSPACE/native/livetv-vpn/build/jniLibs"
      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.TV_LOCAL_PROPERTIES_BASE64 }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*sdk\.dir[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi
          touch local.dev.properties
          if [ -n "$NUVIO_SUPABASE_URL" ]; then
            {
              echo "NUVIO_SUPABASE_URL=$NUVIO_SUPABASE_URL"
              echo "NUVIO_SUPABASE_ANON_KEY=$NUVIO_SUPABASE_ANON_KEY"
            } >> local.properties
          fi
          bash "$GITHUB_WORKSPACE/.github/scripts/add_tracking_keys.sh" local.properties

      # The persistent signing key comes from secrets so every release installs
      # over the previous one. Without the secret, a throwaway key is generated
      # (the build still works, but updates won't install over an older one).
      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.jks"
            alias_name="$SIGNING_KEY_ALIAS"
            password="$SIGNING_PASSWORD"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set; using a throwaway key. Updates will not install over a previous version until this secret is added."
            alias_name=androiddebugkey
            password=android
            keytool -genkeypair -keystore "$RUNNER_TEMP/signing.jks" \
              -storepass "$password" -alias "$alias_name" -keypass "$password" \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "::add-mask::$password"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/signing.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=$alias_name"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$password"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$password"
            echo "SIGNING_KEY_ALIAS_RESOLVED=$alias_name"
            echo "SIGNING_PASSWORD_RESOLVED=$password"
          } >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew :app:assembleFullDebug -Pmeowio.armOnly=true -Pnuvio.app.versionName=0.2.58 -Pnuvio.app.versionCode=$((2000 + ${{ github.run_number }})) --stacktrace

      - name: Rename APK
        run: |
          apk=app/build/outputs/apk/full/debug/app-full-universal-debug.apk
          [ -f "$apk" ] || apk=app/build/outputs/apk/full/debug/app-full-debug.apk
          cp "$apk" "$RUNNER_TEMP/Meowio-tv.apk"

      # Re-sign with the persistent key so the shipped APK always carries the
      # same signature regardless of how the build type signs by default.
      - name: Sign APK
        run: |
          echo "::add-mask::$SIGNING_PASSWORD_RESOLVED"
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner=$(find "$sdk/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/signing.jks" \
            --ks-pass "pass:$SIGNING_PASSWORD_RESOLVED" \
            --ks-key-alias "$SIGNING_KEY_ALIAS_RESOLVED" \
            --key-pass "pass:$SIGNING_PASSWORD_RESOLVED" \
            "$RUNNER_TEMP/Meowio-tv.apk"
          "$apksigner" verify --print-certs "$RUNNER_TEMP/Meowio-tv.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tv-apk
          path: ${{ runner.temp }}/Meowio-tv.apk
          if-no-files-found: error
          retention-days: 7

  mobile:
    name: Build phone APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: native/livetv-vpn/go.sum
      - name: Build Live TV VPN library
        run: bash "$GITHUB_WORKSPACE/native/livetv-vpn/build-android.sh" "$ANDROID_NDK_LATEST_HOME" "$GITHUB_WORKSPACE/native/livetv-vpn/build/jniLibs"
      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.MOBILE_LOCAL_PROPERTIES_BASE64 }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi
          if [ -n "$NUVIO_SUPABASE_URL" ]; then
            {
              echo "NUVIO_SUPABASE_URL=$NUVIO_SUPABASE_URL"
              echo "NUVIO_SUPABASE_ANON_KEY=$NUVIO_SUPABASE_ANON_KEY"
            } >> local.properties
          fi
          bash "$GITHUB_WORKSPACE/.github/scripts/add_tracking_keys.sh" local.properties

      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.jks"
            alias_name="$SIGNING_KEY_ALIAS"
            password="$SIGNING_PASSWORD"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set; using a throwaway key. Updates will not install over a previous version until this secret is added."
            alias_name=androiddebugkey
            password=android
            keytool -genkeypair -keystore "$RUNNER_TEMP/signing.jks" \
              -storepass "$password" -alias "$alias_name" -keypass "$password" \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "::add-mask::$password"
          {
            echo "SIGNING_KEY_ALIAS_RESOLVED=$alias_name"
            echo "SIGNING_PASSWORD_RESOLVED=$password"
          } >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew :androidApp:assembleFullDebug "-Dorg.gradle.jvmargs=-Xmx7g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx4g --max-workers=2 -Pmeowio.armOnly=true -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore -Pnuvio.app.versionName=0.2.58 -Pnuvio.app.versionCode=$((3000 + ${{ github.run_number }})) --stacktrace

      - name: Rename APK
        run: cp androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk "$RUNNER_TEMP/Meowio-mobile.apk"

      - name: Sign APK
        run: |
          echo "::add-mask::$SIGNING_PASSWORD_RESOLVED"
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner=$(find "$sdk/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/signing.jks" \
            --ks-pass "pass:$SIGNING_PASSWORD_RESOLVED" \
            --ks-key-alias "$SIGNING_KEY_ALIAS_RESOLVED" \
            --key-pass "pass:$SIGNING_PASSWORD_RESOLVED" \
            "$RUNNER_TEMP/Meowio-mobile.apk"
          "$apksigner" verify --print-certs "$RUNNER_TEMP/Meowio-mobile.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: ${{ runner.temp }}/Meowio-mobile.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [tv, mobile]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.2.58"
          cat > notes.md <<'NOTES'
          ## What's new in 0.2.58

          - **Plex and Silo media servers, on every app.** Settings > Media servers now adds Plex and Silo next to Jellyfin and Emby. Plex signs in with a code at plex.tv/link (with Plex Home users and PINs) and finds the best home or internet address by itself. Silo signs in with a code or your Silo account, with profiles and PINs. Titles on your server become sources that Smart play can pick, recent additions show on Home, and what you watch is reported back so watched marks and resume points stay in step. Android TV, phone, iPhone, Mac, Windows and Apple TV.
          - Jellyfin and Emby sign-ins now stay separate per profile.

          ## Download

          Choose the download for your device.

          | Device | File |
          | --- | --- |
          | Android TV, Google TV, Fire TV (Android-based) | [Meowio-tv.apk](https://github.com/REPO/releases/download/TAG/Meowio-tv.apk) |
          | Android phone or tablet | [Meowio-mobile.apk](https://github.com/REPO/releases/download/TAG/Meowio-mobile.apk) |
          | iPhone / iPad | [Meowio-ios.ipa](https://github.com/REPO/releases/download/TAG/Meowio-ios.ipa) |
          | Mac, Apple Silicon | [Meowio-macos-arm64.dmg](https://github.com/REPO/releases/download/TAG/Meowio-macos-arm64.dmg) |
          | Apple TV | [Meowio-tvos.ipa](https://github.com/REPO/releases/download/TAG/Meowio-tvos.ipa) |
          | Windows 10/11 (64-bit) | [Meowio-windows-x64.exe](https://github.com/REPO/releases/download/TAG/Meowio-windows-x64.exe) |

          ## Installation

          See the [installation guide](https://github.com/REPO#readme) for your device.

          iPhone, Apple TV, Mac and Windows downloads are uploaded separately after Android. While builds finish, some files may still be from the previous release.

          NOTES
          sed -i 's/^          //' notes.md
          sed -i "s|REPO|${{ github.repository }}|g; s|TAG|$tag|g" notes.md
          gh release create "$tag" apks/*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Meowio $tag" \
            --notes-file notes.md \
            --latest
          # Carry the most recent Apple and Windows builds over so this page always offers every platform.
          mkdir -p apple
          for t in $(gh release list --repo "${{ github.repository }}" --limit 30 --json tagName -q '.[].tagName' | grep -vx "$tag"); do
            gh release download "$t" --repo "${{ github.repository }}" --dir apple --skip-existing \
              --pattern 'Meowio-ios.ipa' --pattern 'Meowio-tvos.ipa' --pattern 'Meowio-macos-arm64.dmg' --pattern 'Meowio-windows-x64.exe' --pattern 'altstore.json' || true
          done
          # Never overwrite a file the Apple, Apple TV or Windows build already attached to this page, and never fail
          # the release over a carried-over file (those builds attach their own copy anyway).
          existing="$(gh release view "$tag" --repo "${{ github.repository }}" --json assets -q '.assets[].name' || true)"
          for f in apple/*; do
            [ -e "$f" ] || continue
            name="$(basename "$f")"
            if grep -qxF "$name" <<<"$existing"; then echo "$name already attached"; continue; fi
            gh release upload "$tag" "$f" --repo "${{ github.repository }}" || echo "::warning::Could not carry over $name; its own build attaches it."
          done
