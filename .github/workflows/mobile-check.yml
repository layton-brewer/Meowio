name: Phone compile check
on:
  push:
    branches: [claude/project-thread-gdrsat]
    paths: ["mobile/**", ".github/workflows/mobile-check.yml"]
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: touch local.properties
      - run: ./gradlew :composeApp:compileFullDebugKotlinAndroid -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace
