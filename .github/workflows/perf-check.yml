name: Android size check

# Compile-only check for the ARM-only packaging change. Builds both apps without publishing.
on:
  push:
    branches: ["claude/perf-pass"]
    paths:
      - "tv/app/build.gradle.kts"
      - "mobile/androidApp/build.gradle.kts"
      - ".github/workflows/perf-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: tv } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: touch local.properties local.dev.properties
      - name: Build
        env:
          NUVIO_RELEASE_STORE_FILE: ${{ runner.temp }}/k.jks
          NUVIO_RELEASE_KEY_ALIAS: androiddebugkey
          NUVIO_RELEASE_KEY_PASSWORD: android
          NUVIO_RELEASE_STORE_PASSWORD: android
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/k.jks" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug" -keyalg RSA -keysize 2048 -validity 10000
          ./gradlew :app:assembleFullDebug -Pmeowio.armOnly=true --stacktrace
      - run: ls -l app/build/outputs/apk/full/debug/*.apk; unzip -l app/build/outputs/apk/full/debug/app-full-universal-debug.apk | grep -c 'lib/x86' || true

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: tv
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: touch local.properties
      - name: Build
        run: ./gradlew :androidApp:assembleFullDebug -Pmeowio.armOnly=true -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1536m" --max-workers=2 --stacktrace
      - run: ls -l androidApp/build/outputs/apk/full/debug/*.apk; unzip -l androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk | grep -c 'lib/x86' || true
